name: Refresh generated files

on:
  push:
    branches: [agent/production-hardening]
    paths:
      - package.json
      - tailwind.config.js
      - src/styles.css
      - scripts/build-assets.js
      - public/index.html
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: generated-files-agent-production-hardening
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refresh deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Build self-hosted frontend assets
        run: npm run build
      - name: Commit generated files
        run: |
          if git diff --quiet -- package-lock.json public/index.html public/assets/tailwind.css public/vendor; then
            echo "Generated files already match sources"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+power0matin@users.noreply.github.com"
          git add package-lock.json public/index.html public/assets/tailwind.css public/vendor
          git commit -m "build: refresh generated frontend assets"
          git push origin HEAD:agent/production-hardening
