name: Refresh lockfile for patched dependency graph

on:
  push:
    branches:
      - fix/security-update-transitive-dependencies-20261022

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-update-transitive-dependencies-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile from the patched manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for patched dependencies"
          git push origin HEAD:fix/security-update-transitive-dependencies-20261022
